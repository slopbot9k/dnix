# Temporary: rebuilds each package that uses dnix from its pushed branch,
# compares the bytes with its dnix.lock, and checks that Dart can load the
# libraries and call them, on Linux x64 (flutter test and an Android
# emulator), Linux arm64 and Windows.
name: Verify consumers

on:
  push:
    branches: [verify-consumers]

permissions:
  contents: read

concurrency:
  group: verify-consumers
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 and Android, ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: tor, repo: slopbot9k/tor, ref: dnix, library: tor_ffi_plugin, bindings: lib/tor_ffi_plugin_bindings_generated.dart, unit: flutter test }
          - { package: flutter_libmwc, repo: slopbot9k/flutter_libepiccash, ref: mwc-dnix, library: mwc_wallet, bindings: lib/mwc.dart, unit: flutter test }
          - { package: frostdart, repo: slopbot9k/frostdart, ref: dnix, library: hrf_api, bindings: lib/frostdart_bindings_generated.dart, unit: dart test }
          - { package: flutter_libepiccash, repo: slopbot9k/flutter_libepiccash, ref: dnix, library: epic_cash_wallet, bindings: lib/src/epic_cash_wallet_bindings.g.dart, unit: flutter test }
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: dnix, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: '${{ matrix.repo }}', ref: '${{ matrix.ref }}', path: pkg, persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Route epiccash's dependency branches to slopbot9k's forks
        if: matrix.package == 'flutter_libepiccash'
        working-directory: pkg
        run: |
          git config --global url.https://github.com/slopbot9k/epic.git.insteadOf https://github.com/cypherstack/epic.git
          git config --global url.https://github.com/slopbot9k/randomx-rust.insteadOf https://github.com/cypherstack/randomx-rust
          rev=$(grep -o 'randomx-rust?branch=[^#]*#[0-9a-f]*' rust/Cargo.lock | cut -d'#' -f2)
          hash=$(jq -r '.rust.outputHashes["randomx-0.2.0"]' dnix.json)
          . ../dnix/verify/run_logged.sh
          logged "Prefetch randomx-rust" nix build --impure --no-link -L --expr "let pkgs = (builtins.getFlake (toString ./.)).inputs.dnix.inputs.nixpkgs.legacyPackages.\${builtins.currentSystem}; in pkgs.fetchgit { url = \"https://github.com/slopbot9k/randomx-rust\"; rev = \"$rev\"; sha256 = \"$hash\"; }"
      - name: Build every sandboxed target
        working-directory: pkg
        run: |
          . ../dnix/verify/run_logged.sh
          logged "Build ${{ matrix.package }}" nix build .#all -L --out-link result
      - name: Compare with dnix.lock
        working-directory: pkg
        run: |
          . ../dnix/verify/run_logged.sh
          logged "Lock ${{ matrix.package }}" python3 ../dnix/verify/compare_lock.py dnix.lock result/SHA256SUMS '^(?!.*-apple-)'
      - name: Collect the Windows library for the Windows job
        run: |
          mkdir -p libs
          python3 dnix/verify/extract_symbols.py pkg ${{ matrix.bindings }} > libs/symbols.txt
          find -L pkg/result -path '*x86_64-pc-windows-*' -name '${{ matrix.library }}.dll' -exec cp {} libs/ \;
          ls -la libs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'libs-${{ matrix.package }}', path: libs, retention-days: 3 }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: 3.47.2, channel: stable, cache: true }
      - name: Unit tests with the library built from source
        working-directory: pkg
        run: |
          . ../dnix/verify/run_logged.sh
          echo source > .dnix-build
          logged "pub get ${{ matrix.package }}" flutter pub get
          logged "Unit tests ${{ matrix.package }}" ${{ matrix.unit }}
      - name: FFI check of the Linux x64 library
        run: |
          . dnix/verify/run_logged.sh
          cp libs/symbols.txt symbols.txt
          cd dnix/verify/ffi_check && dart pub get
          logged "FFI x64 ${{ matrix.package }}" dart run bin/ffi_check.dart ${{ matrix.package }} ../../../pkg/result/x86_64-unknown-linux-gnu/lib${{ matrix.library }}.so ../../../symbols.txt
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - name: Add the integration test to the example app
        working-directory: pkg/example
        run: |
          mkdir -p integration_test
          cp ../../dnix/verify/integration/ffi_test.dart ../../dnix/verify/integration/checks.dart integration_test/
          cp ../../dnix/verify/integration/calls/${{ matrix.package }}.dart integration_test/calls.dart
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}'
          flutter pub add ffi
          echo "SYMBOLS=$(paste -sd, ../../symbols.txt)" >> "$GITHUB_ENV"
      - name: Load and call the Android library in the example app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd pkg/example && (flutter test integration_test/ffi_test.dart -d emulator-5554 --dart-define=PACKAGE=${{ matrix.package }} --dart-define=LIBRARY=${{ matrix.library }} --dart-define=SYMBOLS=${{ env.SYMBOLS }} > ../../android.log 2>&1; status=$?; tail -n 60 ../../android.log; if [ $status -ne 0 ]; then echo "::error title=Android ${{ matrix.package }}::$(grep -v -E '^\s*$' ../../android.log | tail -c 2500 | tr '\n' ' ')"; exit 1; fi)

  linux-arm64:
    name: Linux arm64, ${{ matrix.package }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: tor, repo: slopbot9k/tor, ref: dnix, library: tor_ffi_plugin, bindings: lib/tor_ffi_plugin_bindings_generated.dart }
          - { package: frostdart, repo: slopbot9k/frostdart, ref: dnix, library: hrf_api, bindings: lib/frostdart_bindings_generated.dart }
          - { package: flutter_libepiccash, repo: slopbot9k/flutter_libepiccash, ref: dnix, library: epic_cash_wallet, bindings: lib/src/epic_cash_wallet_bindings.g.dart }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: dnix, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: '${{ matrix.repo }}', ref: '${{ matrix.ref }}', path: pkg, persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Route epiccash's dependency branches to slopbot9k's forks
        if: matrix.package == 'flutter_libepiccash'
        working-directory: pkg
        run: |
          git config --global url.https://github.com/slopbot9k/epic.git.insteadOf https://github.com/cypherstack/epic.git
          git config --global url.https://github.com/slopbot9k/randomx-rust.insteadOf https://github.com/cypherstack/randomx-rust
          rev=$(grep -o 'randomx-rust?branch=[^#]*#[0-9a-f]*' rust/Cargo.lock | cut -d'#' -f2)
          hash=$(jq -r '.rust.outputHashes["randomx-0.2.0"]' dnix.json)
          . ../dnix/verify/run_logged.sh
          logged "Prefetch randomx-rust" nix build --impure --no-link -L --expr "let pkgs = (builtins.getFlake (toString ./.)).inputs.dnix.inputs.nixpkgs.legacyPackages.\${builtins.currentSystem}; in pkgs.fetchgit { url = \"https://github.com/slopbot9k/randomx-rust\"; rev = \"$rev\"; sha256 = \"$hash\"; }"
      - name: Build the arm64 Linux library natively
        working-directory: pkg
        run: |
          . ../dnix/verify/run_logged.sh
          logged "Build arm64 ${{ matrix.package }}" nix build .#aarch64-unknown-linux-gnu -L --out-link result
          library=$(find -L result -name 'lib${{ matrix.library }}.so' | head -1)
          echo "LIBRARY_FILE=$PWD/$library" >> "$GITHUB_ENV"
          printf '%s  ./aarch64-unknown-linux-gnu/lib${{ matrix.library }}.so\n' "$(sha256sum "$library" | cut -d' ' -f1)" > sums
          logged "Lock arm64 ${{ matrix.package }}" python3 ../dnix/verify/compare_lock.py dnix.lock sums '^aarch64-unknown-linux-gnu/'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: { sdk: 3.13.2 }
      - name: FFI check of the arm64 Linux library
        run: |
          . dnix/verify/run_logged.sh
          python3 dnix/verify/extract_symbols.py pkg ${{ matrix.bindings }} > symbols.txt
          cd dnix/verify/ffi_check && dart pub get
          logged "FFI arm64 ${{ matrix.package }}" dart run bin/ffi_check.dart ${{ matrix.package }} "$LIBRARY_FILE" ../../../symbols.txt

  windows:
    name: Windows x64, ${{ matrix.package }}
    needs: linux
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: tor, library: tor_ffi_plugin }
          - { package: flutter_libmwc, library: mwc_wallet }
          - { package: frostdart, library: hrf_api }
          - { package: flutter_libepiccash, library: epic_cash_wallet }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: dnix, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'libs-${{ matrix.package }}', path: libs }
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: { sdk: 3.13.2 }
      - name: Compile the FFI check
        working-directory: dnix/verify/ffi_check
        run: |
          dart pub get
          dart compile exe bin/ffi_check.dart -o ffi_check.exe
      # Only Windows' own directories on PATH, so the DLL's imports resolve
      # the way they would on a user's machine.
      - name: FFI check of the Windows library
        shell: pwsh
        run: |
          $check = (Resolve-Path dnix/verify/ffi_check/ffi_check.exe).Path
          $dll = (Resolve-Path "libs/${{ matrix.library }}.dll").Path
          $symbols = (Resolve-Path libs/symbols.txt).Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = & $check ${{ matrix.package }} $dll $symbols 2>&1
          $status = $LASTEXITCODE
          $output
          if ($status -ne 0) { "::error title=Windows ${{ matrix.package }}::$(($output | Out-String) -replace '\r?\n', ' ')"; exit $status }
