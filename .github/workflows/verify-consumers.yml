# Temporary: builds each package that uses dnix on three different hosts
# with the dnix commit under test, compares every output across the hosts,
# and checks that the libraries load and answer through Dart FFI on Linux
# x64, Linux arm64, Windows and an Android emulator.
name: Verify consumers

on:
  push:
    branches: [verify-final]

permissions:
  contents: read

concurrency:
  group: verify-final
  cancel-in-progress: true

env:
  DNIX_REV: 8c93e210e77b5979c0043ccb6a19d4ad38f77393

jobs:
  build:
    name: ${{ matrix.host }}, ${{ matrix.package.name }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 330
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        package:
          - { name: tor, repo: slopbot9k/tor, ref: dnix, library: tor_ffi_plugin, bindings: lib/tor_ffi_plugin_bindings_generated.dart }
          - { name: flutter_libmwc, repo: slopbot9k/flutter_libepiccash, ref: mwc-dnix, library: mwc_wallet, bindings: lib/mwc.dart }
          - { name: frostdart, repo: slopbot9k/frostdart, ref: dnix, library: hrf_api, bindings: lib/frostdart_bindings_generated.dart }
          - { name: flutter_libepiccash, repo: slopbot9k/flutter_libepiccash, ref: dnix, library: epic_cash_wallet, bindings: lib/src/epic_cash_wallet_bindings.g.dart }
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: dnix, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: '${{ matrix.package.repo }}', ref: '${{ matrix.package.ref }}', path: pkg, persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Route epiccash's dependency branches to slopbot9k's forks
        if: matrix.package.name == 'flutter_libepiccash'
        working-directory: pkg
        run: |
          . ../dnix/verify/run_logged.sh
          git config --global url.https://github.com/slopbot9k/epic.git.insteadOf https://github.com/cypherstack/epic.git
          git config --global url.https://github.com/slopbot9k/randomx-rust.insteadOf https://github.com/cypherstack/randomx-rust
          rev=$(grep -o 'randomx-rust?branch=[^#]*#[0-9a-f]*' rust/Cargo.lock | cut -d'#' -f2)
          hash=$(jq -r '.rust.outputHashes["randomx-0.2.0"]' dnix.json)
          logged "Prefetch randomx-rust" nix build --impure --no-link -L --expr "let pkgs = (builtins.getFlake (toString ./.)).inputs.dnix.inputs.nixpkgs.legacyPackages.\${builtins.currentSystem}; in pkgs.fetchgit { url = \"https://github.com/slopbot9k/randomx-rust\"; rev = \"$rev\"; sha256 = \"$hash\"; }"
      - name: Build every target this host builds in the sandbox
        id: build
        working-directory: pkg
        run: |
          . ../dnix/verify/run_logged.sh
          logged "Build ${{ matrix.package.name }} on ${{ matrix.host }}" nix build .#all --override-input dnix "github:slopbot9k/dnix/$DNIX_REV" -L --out-link result
          mkdir -p ../sums && cp result/SHA256SUMS ../sums/
          ls result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with: { name: 'sums-${{ matrix.package.name }}--${{ matrix.host }}', path: sums, retention-days: 3 }
      - name: Publish this host's libraries and archive manifests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p publish && cp pkg/result/SHA256SUMS publish/
          for dir in pkg/result/*/; do
            target=$(basename "$dir")
            for f in "$dir"*; do
              name=$(basename "$f")
              case "$name" in
                *.so|*.dll) cp "$f" "publish/${target}__${name}" ;;
                *.a|*.lib) python3 dnix/verify/archive_manifest.py "$f" > "publish/${target}__${name}.members.txt" ;;
              esac
            done
          done
          tag="final-${{ matrix.package.name }}-${{ matrix.host }}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Temporary: ${{ matrix.package.name }} built on ${{ matrix.host }}" --notes "Build output for comparing hosts; deleted after the comparison." publish/*
      - name: Collect the Windows library and symbols
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.host == 'ubuntu-24.04' }}
        run: |
          mkdir -p libs
          python3 dnix/verify/extract_symbols.py pkg ${{ matrix.package.bindings }} > libs/symbols.txt
          find -L pkg/result -path '*x86_64-pc-windows-*' -name '${{ matrix.package.library }}.dll' -exec cp {} libs/ \;
          for pair in x86_64:x86_64-linux-android arm64-v8a:aarch64-linux-android armeabi-v7a:armv7-linux-androideabi; do
            abi=${pair%%:*}; target=${pair#*:}
            if [ -e "pkg/result/$target/lib${{ matrix.package.library }}.so" ]; then
              mkdir -p "libs/android/$abi" && cp "pkg/result/$target/lib${{ matrix.package.library }}.so" "libs/android/$abi/"
            fi
          done
          find libs -type f | sort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.host == 'ubuntu-24.04' }}
        with: { name: 'libs-${{ matrix.package.name }}', path: libs, retention-days: 3 }
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        with: { sdk: 3.13.2 }
      - name: FFI check of this host's own Linux library
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          . dnix/verify/run_logged.sh
          triple=$([ "$(uname -m)" = aarch64 ] && echo aarch64-unknown-linux-gnu || echo x86_64-unknown-linux-gnu)
          library="$PWD/pkg/result/$triple/lib${{ matrix.package.library }}.so"
          if [ ! -e "$library" ]; then echo "${{ matrix.package.name }} ships no $triple library"; exit 0; fi
          python3 dnix/verify/extract_symbols.py pkg ${{ matrix.package.bindings }} > symbols.txt
          cd dnix/verify/ffi_check && dart pub get
          logged "FFI ${{ matrix.package.name }} $triple" dart run bin/ffi_check.dart ${{ matrix.package.name }} "$library" ../../../symbols.txt

  compare:
    name: Compare the hosts
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'sums-*', path: sums }
      - run: python3 verify/compare_hosts.py sums

  windows:
    name: Windows x64, ${{ matrix.package }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: tor, library: tor_ffi_plugin }
          - { package: flutter_libmwc, library: mwc_wallet }
          - { package: frostdart, library: hrf_api }
          - { package: flutter_libepiccash, library: epic_cash_wallet }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: dnix, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'libs-${{ matrix.package }}', path: libs }
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: { sdk: 3.13.2 }
      - name: Compile the FFI check
        working-directory: dnix/verify/ffi_check
        run: |
          dart pub get
          dart compile exe bin/ffi_check.dart -o ffi_check.exe
      # Only Windows' own directories on PATH, so the DLL's imports resolve
      # the way they would on a user's machine.
      - name: FFI check of the Windows library
        shell: pwsh
        run: |
          $check = (Resolve-Path dnix/verify/ffi_check/ffi_check.exe).Path
          $dll = (Resolve-Path "libs/${{ matrix.library }}.dll").Path
          $symbols = (Resolve-Path libs/symbols.txt).Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = & $check ${{ matrix.package }} $dll $symbols 2>&1
          $status = $LASTEXITCODE
          $output
          if ($status -ne 0) { "::error title=Windows ${{ matrix.package }}::$(($output | Out-String) -replace '\r?\n', ' ')"; exit $status }
          "::notice title=Windows ${{ matrix.package }}::$(($output | Select-Object -Last 1) -join ' ')"
